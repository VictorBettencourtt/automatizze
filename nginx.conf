server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache para assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Home page
    location = / {
        try_files /index.html =404;
    }

    # Panel, proposta and other known pages
    location ~ ^/(painel|proposta)\.html$ {
        try_files $uri =404;
    }

    # proposals.json — never cache, always serve fresh
    location = /proposals.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Access-Control-Allow-Origin "*";
        expires -1;
        try_files $uri =404;
    }

    # Any other path without extension = proposal slug
    # tries the exact file first, then falls back to proposta.html (template)
    location ~ ^/[a-z0-9][a-z0-9-]*$ {
        try_files $uri $uri.html /proposta.html;
    }

    # Default fallback
    location / {
        try_files $uri $uri.html /index.html;
    }


    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-XSS-Protection "1; mode=block";

    # Esconde versão do nginx
    server_tokens off;
}
